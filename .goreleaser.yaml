# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: homelab-fmt
builds:
  - main: ./cmd/homelab-fmt
    binary: homelab-fmt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github-native
