---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
kind: HelmRelease
apiVersion: helm.toolkit.fluxcd.io/v2
metadata:
  namespace: demo
  name: demo
spec:
  upgrade:
    cleanupOnFail: true
  # Values come from the generated ConfigMap.
  valuesFrom:
    - kind: ConfigMap
      name: demo-values
  dependsOn:
    - name: other
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      version: 5.2.1
      chart: app-template
  interval: 15m
