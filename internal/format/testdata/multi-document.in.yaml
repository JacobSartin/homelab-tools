apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: cluster
  dependsOn:
    - name: volsync
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: values
resources:
  - helm-release.yaml
