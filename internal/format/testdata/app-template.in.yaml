# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.4.0/charts/other/app-template/values.schema.json
persistence:
  config:
    type: emptyDir

    globalMounts:
      - path: /config
  cache:
    type: emptyDir
service:
  app:
    ports:
      http:
        port: 80

    controller: app
controllers:
  app:
    containers:
      app:
        resources:
          limits:
            memory: 1Gi
        probes:
          readiness:
            enabled: true

          liveness:
            enabled: true
        securityContext: {}
        image:
          tag: "1.0"
          repository: example/app
