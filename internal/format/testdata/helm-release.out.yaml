---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo
  namespace: demo
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  dependsOn:
    - name: other
  upgrade:
    cleanupOnFail: true
  # Values come from the generated ConfigMap.
  valuesFrom:
    - kind: ConfigMap
      name: demo-values
