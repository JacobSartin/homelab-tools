# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# homelab-fmt: extends kubernetes.yaml
# Values are placeholders.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: example
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: example
        namespace: flux-system
      interval: 15m
  chartRef:
    kind: OCIRepository
    name: example
    namespace: flux-system
  releaseName: example
  targetNamespace: example
  storageNamespace: example
  serviceAccountName: example
  dependsOn: []
  suspend: false
  timeout: 20m
  maxHistory: 3
  driftDetection: {}
  install: {}
  upgrade: {}
  test: {}
  rollback: {}
  uninstall: {}
  # Inline values are merged over valuesFrom.
  valuesFrom: []
  values: {}
  postRenderers: []
