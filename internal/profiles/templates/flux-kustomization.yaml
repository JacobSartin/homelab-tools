# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# homelab-fmt: extends kubernetes.yaml
# Values are placeholders.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: example
spec:
  dependsOn: []
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./example
  prune: true
  sourceRef:
    kind: GitRepository
    name: example
  wait: true
  suspend: false
  targetNamespace: example
  serviceAccountName: example
  decryption: {}
  postBuild: {}
  components: []
  patches: []
  healthChecks: []
  healthCheckExprs: []
